# Render Blueprint for the RR Kitchen API + database.
#
# The web app (apps/web) is NOT deployed from here — it's a separate Next.js
# app deployed to Vercel. This blueprint only covers the pieces Vercel can't
# run: the Express + Socket.io API (needs a persistent process) and Postgres.
#
# To use: Render dashboard -> New -> Blueprint -> point at this repo. Render
# reads this file and provisions both resources below. After the first
# deploy, set WEB_ORIGIN (see envVars) to the real Vercel URL and redeploy.
databases:
  - name: rr-kitchen-db
    plan: free
    databaseName: rrkitchen
    user: rrkitchen

services:
  - type: web
    name: rr-kitchen-api
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production is set below for the running
    # server (needed for secure cookies/HSTS — see app.ts), but npm reads
    # that same env var during install too and silently skips
    # devDependencies by default when it's set to "production" — which
    # would drop typescript, the @types/* packages, and prisma itself
    # right when the build needs them.
    buildCommand: npm install --include=dev && npm run prisma:generate -w apps/server && npm run build:shared && npm run build -w apps/server
    startCommand: npm run prisma:migrate:deploy -w apps/server && node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rr-kitchen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEB_ORIGIN
        sync: false # set manually after the Vercel deploy: https://<your-app>.vercel.app
